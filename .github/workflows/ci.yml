name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege. A fork PR gets a read-only token; nothing here needs more.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so fork PR pushes cannot pile up runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
      # new code, a SHA cannot. Dependabot bumps these; the trailing comment records
      # which version each SHA corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit (surefire) + integration (*IT via failsafe) + coverage (quarkus-jacoco).
      # Run from the repo root so the aggregator builds every module.
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: service/target/jacoco-report
          if-no-files-found: ignore

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vite 8 and @vitejs/plugin-react 6 require ^20.19.0 || >=22.12.0.
          # Pinned to 22 rather than 20 so the floor is unambiguous.
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build
