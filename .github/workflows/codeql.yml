name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so newly published rules reach old code even when nothing changes.
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write   # required to upload results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Explicit build rather than autobuild, and `package` rather than `compile`.
      # service/src/main/java is EMPTY -- every main class is generated by Kogito from
      # the BPMN/DMN models. `mvn compile` therefore finds no sources, javac never runs,
      # and CodeQL fails with "didn't build any of it". `package` runs codegen, compiles
      # the generated sources, and (with -DskipTests, which skips execution but not
      # compilation) also builds the hand-written test classes.
      # `clean` is deliberate: CodeQL traces javac invocations, so an up-to-date build
      # that skips compilation would produce an empty database.
      - name: Build
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp clean package -DskipTests

      - name: Analyze
        uses: github/codeql-action/analyze@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          category: /language:${{ matrix.language }}
