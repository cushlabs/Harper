# ── HTTP ─────────────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ── Dev Services ──────────────────────────────────────────────────────────────
# Kogito tries to auto-start a Data Index container (via Testcontainers) in dev mode,
# which requires Docker/Podman. Disabled so the service runs without a container runtime.
# The process REST endpoints (start/list/fetch instances) work regardless; Data Index
# only adds richer querying. Set to true (with Docker running) if you want it.
quarkus.kogito.devservices.enabled=false

# ── CORS (allows the Vite dev server at :5173 to call this API) ───────────────
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# ── OpenAPI / Swagger UI (dev: http://localhost:8080/q/swagger-ui) ────────────
quarkus.smallrye-openapi.info-title=Project Harper — ED Trafficking Detection API
mp.openapi.extensions.smallrye.info.version=0.1.0
mp.openapi.extensions.smallrye.info.description=Kogito-generated endpoints for the Harper BPMN processes and DMN decisions.
quarkus.swagger-ui.always-include=true

# ── Health probes (Kubernetes) ───────────────────────────────────────────────
# Liveness:  /q/health/live     Readiness: /q/health/ready

# ── Container image (Jib) ─────────────────────────────────────────────────────
quarkus.container-image.group=harper
quarkus.container-image.name=harper-service
quarkus.container-image.tag=0.1.0

# ── Kubernetes manifest generation (target/kubernetes/kubernetes.yml) ─────────
quarkus.kubernetes.namespace=harper
quarkus.kubernetes.replicas=2
quarkus.kubernetes.ports.http.container-port=8080
quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready

# ── Kogito ────────────────────────────────────────────────────────────────────
# Base URL advertised in generated links (override per environment).
kogito.service.url=http://localhost:8080
